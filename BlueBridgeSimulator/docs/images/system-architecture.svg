  <text class="t" x="230" y="66">Keil µVision</text>
  <text class="s" x="230" y="88">BlueBridgeAGDI.dll · AGDI 调试驱动</text>
  <rect class="nodeR" x="140" y="160" width="440" height="64" rx="8" />
  <text class="t" x="160" y="186">调试接口层</text>
