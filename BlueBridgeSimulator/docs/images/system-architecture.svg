    .boundary { fill: #F5F5F7; stroke: rgba(23, 23, 23, 0.14); stroke-width: 1; stroke-dasharray: 6 5; }
    .t { fill: #171717; font: 500 14px "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
    .s { fill: #52525B; font: 400 12px "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
    .ctitle { fill: #52525B; font: 500 12px "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
    .conn { stroke: rgba(82, 82, 91, 0.7); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .connB { stroke: #4B3FE3; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .arrowN { fill: rgba(82, 82, 91, 0.75); }
