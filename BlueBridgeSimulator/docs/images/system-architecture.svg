    .cap { fill: #FFFFFF; stroke: rgba(23, 23, 23, 0.14); }
    .capT { fill: #171717; font: 500 12px "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
  </style>
  <rect width="720" height="712" fill="#FFFFFF" />
  <defs>
    <marker id="bbAb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
