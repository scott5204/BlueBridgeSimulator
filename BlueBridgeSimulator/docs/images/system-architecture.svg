  <path class="connB" d="M360 224 V276" marker-end="url(#bbAb)" />
  <path class="conn" d="M354 382 V406" marker-end="url(#bbAn)" />
  <path class="conn" d="M366 406 V382" marker-end="url(#bbAn)" />
