<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 712" width="720" height="712" role="img" aria-label="BlueBridgeSimulator 系统框图">
  <title>BlueBridgeSimulator 系统框图</title>
  <style>
    .nodeR { fill: #F7F7F8; stroke: rgba(23, 23, 23, 0.14); stroke-width: 1; }
